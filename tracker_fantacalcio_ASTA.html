<html lang="it">
<head>

    <title>Fantacalcio - Asta 2026-27</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header h1 { color: #667eea; margin-bottom: 10px; }
        .crediti-info {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
        }
        .crediti-bar {
            width: 100%;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            margin-top: 10px;
            overflow: hidden;
        }
        .crediti-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            transition: width 0.3s;
        }
        .btn-import {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            font-size: 16px;
        }
        .btn-import:hover { background: #e68900; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 12px 24px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #667eea;
            color: white;
        }
        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .tab-content.active { display: block; }
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-box input, .search-box select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .search-box input { flex: 1; min-width: 150px; }
        .giocatori-list {
            display: grid;
            gap: 10px;
        }
        .giocatore-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .giocatore-info { flex: 1; }
        .giocatore-nome { font-weight: bold; color: #333; }
        .giocatore-dettagli { font-size: 12px; color: #666; }
        .giocatore-quota { font-weight: bold; color: #764ba2; margin-right: 15px; min-width: 60px; text-align: right; }
        .giocatore-costo { font-weight: bold; color: #d32f2f; margin-right: 15px; min-width: 70px; text-align: right; }
        .btn-prendi {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-prendi:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-rimuovi {
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-wish {
            padding: 8px 16px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h2 { margin-bottom: 20px; color: #667eea; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-conferma { background: #667eea; color: white; }
        .btn-annulla { background: #ddd; color: #333; }
        .rosa-vuota { text-align: center; padding: 40px; color: #999; }
        .rosa-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-label { font-size: 12px; color: #666; }
        .stat-value { font-size: 24px; font-weight: bold; color: #667eea; }
        .wishlist-item {
            padding: 12px;
            background: #f0f7ff;
            border-left: 4px solid #17a2b8;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .wishlist-item.preso {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }
        .wishlist-header {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .wishlist-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
    </style>
</head>

        <div class="header">
            <h1>⚽ Fantacalcio - Asta 2026-27</h1>

        <div class="tabs">

            <button class="tab-btn" onclick="switchTab('wishlist')">📋 Wishlist</button>

        <div id="ricerca" class="tab-content active">
            <div class="search-box">
                <input type="text" id="searchNome" placeholder="Cerca nome..." onkeyup="filtraGiocatori()">

        <div id="rosa" class="tab-content">

            </div>
            <div id="rosaList" class="giocatori-list"></div>
            <div id="rosaVuota" class="rosa-vuota">Nessun giocatore ancora!</div>
        </div>

        <div id="wishlist" class="tab-content">
            <div class="search-box">

            </div>
            <div id="wishlistContainer"></div>
            <div id="wishlistVuota" class="rosa-vuota">Nessun giocatore nella wishlist</div>
        </div>
    </div>

        let rosa = JSON.parse(localStorage.getItem('rosa')) || [];
        let wishlist = JSON.parse(localStorage.getItem('fantacalcioData')) || {};
        let giocatoriFilterati = [...giocatori];
        let wishlistFilterata = [];
        let giocatoreSelezionato = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'rosa') renderRosa();
            if (tab === 'wishlist') renderWishlist();
        }

        function filtraGiocatori() {
            const nome = document.getElementById('searchNome').value.toLowerCase();
            const squadra = document.getElementById('searchSquadra').value.toLowerCase();
            const ruolo = document.getElementById('searchRuolo').value;
            giocatoriFilterati = giocatori.filter(g => {
                const matchNome = g.nome.toLowerCase().includes(nome);
                const matchSquadra = g.squadra.toLowerCase().includes(squadra);
                const matchRuolo = !ruolo || g.ruolo === ruolo;
                return matchNome && matchSquadra && matchRuolo;
            });
            renderRicerca();
        }

        function renderRicerca() {
            const html = giocatoriFilterati.map(g => {
                const giaPreso = rosa.find(x => x.id === g.id);
                return `<div class="giocatore-row">
                    <div class="giocatore-info">
                        <div class="giocatore-nome">${g.nome}</div>
                        <div class="giocatore-dettagli">${g.squadra} • ${g.ruolo}</div>
                    </div>
                    <div class="giocatore-quota">Qt.M: ${g.quota_m}</div>
                    <button class="btn-prendi" onclick="apriModal(${g.id}, '${g.nome}', ${g.quota_m})" ${giaPreso ? 'disabled' : ''}>
                        ${giaPreso ? '✅ Preso' : 'PRENDI'}
                    </button>
                </div>`;
            }).join('');
            document.getElementById('giocatoriList').innerHTML = html || '<p style="text-align:center; color:#999;">Nessun giocatore trovato</p>';
        }

        function apriModal(id, nome, quota) {
            giocatoreSelezionato = id;
            document.getElementById('modalNome').textContent = nome;
            document.getElementById('modalQuota').textContent = quota;
            document.getElementById('costoPagato').value = '';
            document.getElementById('modal').classList.add('show');
            document.getElementById('costoPagato').focus();
        }

        function chiudiModal() {
            document.getElementById('modal').classList.remove('show');
            giocatoreSelezionato = null;
        }

        function confermaPresa() {
            const costo = parseInt(document.getElementById('costoPagato').value);
            if (!costo || costo < 1) {
                alert('Inserisci un costo valido!');
                return;
            }
            const totalSpeso = rosa.reduce((s, g) => s + g.costo, 0);
            if (totalSpeso + costo > 300) {
                alert(`Crediti insufficienti! Ne hai ${300 - totalSpeso} disponibili.`);
                return;
            }
            const giocatore = giocatori.find(g => g.id === giocatoreSelezionato);
            rosa.push({
                id: giocatore.id,
                nome: giocatore.nome,
                squadra: giocatore.squadra,
                ruolo: giocatore.ruolo,
                quota_m: giocatore.quota_m,
                costo: costo
            });
            localStorage.setItem('rosa', JSON.stringify(rosa));
            updateCrediti();
            renderRicerca();
            chiudiModal();
        }

        function renderRosa() {
            if (rosa.length === 0) {
                document.getElementById('rosaVuota').style.display = 'block';
                document.getElementById('rosaList').innerHTML = '';
                updateRosaStats();
                return;
            }
            document.getElementById('rosaVuota').style.display = 'none';
            const html = rosa.map(g => `<div class="giocatore-row">
                <div class="giocatore-info">
                    <div class="giocatore-nome">${g.nome}</div>
                    <div class="giocatore-dettagli">${g.squadra} • ${g.ruolo}</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-weight: bold; color: #764ba2;">Pagato: ${g.costo}cr</div>
                    <div style="font-size: 12px; color: #999;">Qt.M: ${g.quota_m}</div>
                </div>
                <button class="btn-rimuovi" onclick="rimuoviGiocatore(${g.id})">❌</button>
            </div>`).join('');
            document.getElementById('rosaList').innerHTML = html;
            updateRosaStats();
        }

        function rimuoviGiocatore(id) {
            if (confirm('Rimuovere?')) {
                rosa = rosa.filter(g => g.id !== id);
                localStorage.setItem('rosa', JSON.stringify(rosa));
                updateCrediti();
                renderRosa();
                renderRicerca();
            }
        }

        function renderWishlist() {
            wishlistFilterata = Object.entries(wishlist);
            if (wishlistFilterata.length === 0) {
                document.getElementById('wishlistContainer').innerHTML = '';
                document.getElementById('wishlistVuota').style.display = 'block';
                return;
            }
            document.getElementById('wishlistVuota').style.display = 'none';
            
            const html = wishlistFilterata.map(([nome, data]) => {
                const isPreso = data.status === 'preso';
                const giocatore = giocatori.find(g => g.nome.toLowerCase() === nome.toLowerCase());
                const ruolo = giocatore ? giocatore.ruolo : '?';
                const squadra = giocatore ? giocatore.squadra : '?';
                
                return `<div class="wishlist-item ${isPreso ? 'preso' : ''}">
                    <div class="wishlist-header">${nome}</div>
                    <div class="wishlist-info">${squadra} • ${ruolo}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-weight: bold; color: #d32f2f;">Pagato: ${data.paid}cr | ${isPreso ? '✅ Preso' : '❌ Wishlist'}</div>
                        <button class="btn-wish" onclick="aggiungiDaWishlist('${nome}', ${data.paid})">➕ Aggiungi</button>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('wishlistContainer').innerHTML = html;
        }

        function filtraWishlist() {
            const search = document.getElementById('searchWish').value.toLowerCase();
            wishlistFilterata = Object.entries(wishlist).filter(([nome, data]) => 
                nome.toLowerCase().includes(search)
            );
            
            if (wishlistFilterata.length === 0) {
                document.getElementById('wishlistContainer').innerHTML = '';
                document.getElementById('wishlistVuota').style.display = 'block';
                return;
            }
            
            document.getElementById('wishlistVuota').style.display = 'none';
            const html = wishlistFilterata.map(([nome, data]) => {
                const isPreso = data.status === 'preso';
                const giocatore = giocatori.find(g => g.nome.toLowerCase() === nome.toLowerCase());
                const ruolo = giocatore ? giocatore.ruolo : '?';
                const squadra = giocatore ? giocatore.squadra : '?';
                
                return `<div class="wishlist-item ${isPreso ? 'preso' : ''}">
                    <div class="wishlist-header">${nome}</div>
                    <div class="wishlist-info">${squadra} • ${ruolo}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-weight: bold; color: #d32f2f;">Pagato: ${data.paid}cr | ${isPreso ? '✅ Preso' : '❌ Wishlist'}</div>
                        <button class="btn-wish" onclick="aggiungiDaWishlist('${nome}', ${data.paid})">➕ Aggiungi</button>
                    </div>
                </div>`;
            }).join('');
            
            document.getElementById('wishlistContainer').innerHTML = html;
        }

        function aggiungiDaWishlist(nome, costo) {
            const giocatore = giocatori.find(g => g.nome.toLowerCase() === nome.toLowerCase());
            if (!giocatore) {
                alert('❌ Giocatore non trovato!');
                return;
            }
            if (rosa.find(x => x.id === giocatore.id)) {
                alert('✅ Giocatore già nella rosa!');
                return;
            }
            const totalSpeso = rosa.reduce((s, g) => s + g.costo, 0);
            if (totalSpeso + costo > 300) {
                alert(`Crediti insufficienti! Ne hai ${300 - totalSpeso} disponibili.`);
                return;
            }
            rosa.push({
                id: giocatore.id,
                nome: giocatore.nome,
                squadra: giocatore.squadra,
                ruolo: giocatore.ruolo,
                quota_m: giocatore.quota_m,
                costo: costo
            });
            localStorage.setItem('rosa', JSON.stringify(rosa));
            updateCrediti();
            renderWishlist();
            alert(`✅ ${nome} aggiunto alla rosa!`);
        }

        function updateCrediti() {
            const totalSpeso = rosa.reduce((s, g) => s + g.costo, 0);
            const rimasti = 300 - totalSpeso;
            const el = document.getElementById('creditiFill');
            if (el) {
                el.style.width = (rimasti / 300 * 100) + '%';
                document.getElementById('creditiFillText').textContent = `${rimasti}/300`;
            }
            document.getElementById('creditiRimasti').textContent = rimasti;
        }

        function updateRosaStats() {
            const totalSpeso = rosa.reduce((s, g) => s + g.costo, 0);
            document.getElementById('countGiocatori').textContent = rosa.length;
            document.getElementById('totalSpeso').textContent = totalSpeso;
            document.getElementById('totalRimasti').textContent = 300 - totalSpeso;
        }

        function importaDaVecchiaApp() {
            const oldData = JSON.parse(localStorage.getItem("fantacalcioData")) || {};
            if (Object.keys(oldData).length === 0) {
                alert('❌ Nessun dato nella vecchia app!');
                return;
            }
            let imported = 0;
            Object.entries(oldData).forEach(([nome, data]) => {
                if (data.status === 'preso') {
                    const g = giocatori.find(x => x.nome.toLowerCase() === nome.toLowerCase());
                    if (g && !rosa.find(x => x.id === g.id)) {
                        rosa.push({
                            id: g.id,
                            nome: g.nome,
                            squadra: g.squadra,
                            ruolo: g.ruolo,
                            quota_m: g.quota_m,
                            costo: data.paid || 0
                        });
                        imported++;
                    }
                }
            });
            if (imported === 0) {
                alert('❌ Nessun giocatore trovato!');
                return;
            }
            localStorage.setItem('rosa', JSON.stringify(rosa));
            updateCrediti();
            renderRosa();
            alert(`✅ Importati ${imported} giocatori!`);
            switchTab('rosa');
        }

        window.addEventListener('DOMContentLoaded', function() {
            updateCrediti();
            renderRicerca();
            renderWishlist();
        });
    </script>
