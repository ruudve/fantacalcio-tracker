<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantacalcio PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .box { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .mode-toggle { background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; }
        .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: white; color: #666; transition: all 0.3s; }
        .mode-btn.active { background: #667eea; color: white; }
        h1 { color: #667eea; text-align: center; margin-bottom: 20px; }
        .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 12px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn.active { background: #667eea; color: white; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .submit { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        .submit:hover { background: #764ba2; }
        .hidden { display: none; }
        .msg { padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; display: none; animation: slideIn 0.3s ease; }
        .msg.show { display: block; }
        .msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .app { display: none; }
        .app.show { display: block; }
        .header { background: #667eea; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logout { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .player-card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f9f9f9; margin-bottom: 10px; border-radius: 8px; }
        .player-info { flex: 1; }
        .player-name { font-weight: bold; color: #333; }
        .player-detail { font-size: 12px; color: #666; }
        .btn-remove { background: #ff6b6b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .console { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; display: none; }
        .console.show { display: block; }
        .console-line { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- MODE TOGGLE -->
        <div style="margin-bottom: 15px;">
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('test')">🧪 TEST MODE</button>
                <button class="mode-btn" onclick="setMode('live')">🔐 LIVE MODE</button>
                <button class="mode-btn" onclick="clearAll()" style="background: #ff6b6b; color: white;">🗑️ PULISCI</button>
            </div>
            <div id="console" class="console show"></div>
        </div>

        <!-- LOGIN/REGISTER -->
        <div id="authScreen" class="box">
            <div class="buttons">
                <button class="btn active" onclick="switchMode('login')">🔐 Login</button>
                <button class="btn" onclick="switchMode('register')">📝 Registrati</button>
            </div>
            <h1 id="title">Login</h1>
            <div id="msg" class="msg"></div>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <input type="text" id="name" placeholder="Nome utente" class="hidden">
            <button class="submit" onclick="submitAuth()">🔐 Accedi</button>
        </div>

        <!-- APP -->
        <div id="appScreen" class="app">
            <div class="header">
                <h1>⚽ Fantacalcio PRO</h1>
                <button class="logout" onclick="logoutUser()">Logout</button>
            </div>
            <div class="box">
                <h2>📋 Rosa</h2>
                <p>Crediti: <strong id="crediti">0</strong>/300</p>
                <div id="rosa" style="margin-top: 15px;"></div>
                <hr style="margin: 20px 0;">
                <h2>✏️ Aggiungi Giocatore</h2>
                <input type="text" id="pName" placeholder="Nome">
                <select id="pRole">
                    <option value="">Ruolo</option>
                    <option value="P">Portiere</option>
                    <option value="D">Difensore</option>
                    <option value="C">Centrocampista</option>
                    <option value="A">Attaccante</option>
                </select>
                <select id="pTeam">
                    <option value="">Squadra</option>
                    <option value="Inter">Inter</option>
                    <option value="Juve">Juventus</option>
                    <option value="Napoli">Napoli</option>
                    <option value="Milan">Milan</option>
                    <option value="Roma">Roma</option>
                    <option value="Lazio">Lazio</option>
                    <option value="Atalanta">Atalanta</option>
                </select>
                <input type="number" id="pCred" placeholder="Crediti">
                <button class="submit" onclick="addPlayer()">✅ Aggiungi</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"></script>

    <script>
        let mode = 'login';
        let user = null;
        let players = [];
        let appMode = 'test'; // test o live

        // Firebase config
        const config = {
            apiKey: "AIzaSyC_jVxTyAiK8R2fC785C8nCQ0Gnr0nZjBtA",
            authDomain: "fantacalcio-pro-8e203.firebaseapp.com",
            projectId: "fantacalcio-pro-8e203",
            storageBucket: "fantacalcio-pro-8e203.firebasestorage.app",
            messagingSenderId: "258140309935",
            appId: "1:258140309935:web:f671d0c437c9a82a1b075a"
        };

        let auth, db;
        try {
            firebase.initializeApp(config);
            auth = firebase.auth();
            db = firebase.firestore();
            log('✅ Firebase inizializzato');
        } catch (e) {
            log('⚠️ Firebase: ' + e.message);
        }

        // Console logger
        function log(msg) {
            console.log(msg);
            const consoleEl = document.getElementById('console');
            const line = document.createElement('div');
            line.className = 'console-line';
            line.textContent = '> ' + msg;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // Cambia modalità app
        function setMode(m) {
            appMode = m;
            const btns = document.querySelectorAll('.mode-btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            log(`🔄 Modalità: ${m === 'test' ? '🧪 TEST (localStorage)' : '🔐 LIVE (Firebase)'}`);
        }

        // Pulisci tutto
        function clearAll() {
            localStorage.clear();
            log('🗑️ localStorage PULITO!');
            setTimeout(() => location.reload(), 500);
        }

        // Auth state listener
        if (auth) {
            auth.onAuthStateChanged(u => {
                if (u && appMode === 'live') {
                    user = u;
                    log('✅ User loggato: ' + u.email);
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('appScreen').classList.add('show');
                    loadPlayers();
                } else if (!u && appMode === 'live') {
                    user = null;
                    document.getElementById('authScreen').style.display = 'block';
                    document.getElementById('appScreen').classList.remove('show');
                }
            });
        }

        // Switch auth mode
        function switchMode(m) {
            mode = m;
            const btns = document.querySelectorAll('.btn');
            btns.forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('title').textContent = m === 'login' ? 'Login' : 'Crea Account';
            document.getElementById('name').classList.toggle('hidden', m !== 'register');
            document.querySelector('.submit').textContent = m === 'login' ? '🔐 Accedi' : '📝 Registrati';
            log(`Switched to: ${m}`);
        }

        // Submit auth
        function submitAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const name = document.getElementById('name').value;
            const msg = document.getElementById('msg');

            log(`1️⃣ Submit: mode=${mode}, email=${email}`);

            if (!email || !pass) {
                msg.textContent = '❌ Email e password obbligatori';
                msg.className = 'msg show error';
                log('❌ Campi mancanti');
                return;
            }

            if (appMode === 'test') {
                log('🧪 TEST MODE: salvo in localStorage');
                if (mode === 'register') {
                    if (!name) {
                        msg.textContent = '❌ Nome obbligatorio';
                        msg.className = 'msg show error';
                        return;
                    }
                    localStorage.setItem('user', JSON.stringify({email, pass, name}));
                    log('✅ Account creato (TEST): ' + email);
                    msg.textContent = '✅ Account creato (TEST MODE)';
                    msg.className = 'msg show success';
                    setTimeout(() => {
                        user = {email, name};
                        document.getElementById('authScreen').style.display = 'none';
                        document.getElementById('appScreen').classList.add('show');
                        loadPlayers();
                    }, 1000);
                } else {
                    const stored = JSON.parse(localStorage.getItem('user') || '{}');
                    if (stored.email === email && stored.pass === pass) {
                        log('✅ Login (TEST): ' + email);
                        user = stored;
                        msg.textContent = '✅ Login (TEST MODE)';
                        msg.className = 'msg show success';
                        setTimeout(() => {
                            document.getElementById('authScreen').style.display = 'none';
                            document.getElementById('appScreen').classList.add('show');
                            loadPlayers();
                        }, 1000);
                    } else {
                        log('❌ Credenziali errate (TEST)');
                        msg.textContent = '❌ Email o password errata (TEST MODE)';
                        msg.className = 'msg show error';
                    }
                }
            } else {
                log('🔐 LIVE MODE: Firebase');
                if (mode === 'register') {
                    if (!name) {
                        msg.textContent = '❌ Nome obbligatorio';
                        msg.className = 'msg show error';
                        return;
                    }
                    auth.createUserWithEmailAndPassword(email, pass)
                        .then(r => {
                            log('✅ Account creato (LIVE): ' + email);
                            return r.user.updateProfile({displayName: name});
                        })
                        .then(() => {
                            msg.textContent = '✅ Account creato!';
                            msg.className = 'msg show success';
                        })
                        .catch(e => {
                            log('❌ Errore registrazione: ' + e.message);
                            msg.textContent = '❌ ' + e.message;
                            msg.className = 'msg show error';
                        });
                } else {
                    auth.signInWithEmailAndPassword(email, pass)
                        .then(() => {
                            log('✅ Login (LIVE): ' + email);
                            msg.textContent = '✅ Login riuscito!';
                            msg.className = 'msg show success';
                        })
                        .catch(e => {
                            log('❌ Errore login: ' + e.message);
                            msg.textContent = '❌ ' + e.message;
                            msg.className = 'msg show error';
                        });
                }
            }
        }

        // Add player
        function addPlayer() {
            const name = document.getElementById('pName').value;
            const role = document.getElementById('pRole').value;
            const team = document.getElementById('pTeam').value;
            const cred = parseInt(document.getElementById('pCred').value);

            if (!name || !role || !team || !cred) {
                log('❌ Compila tutti i campi');
                alert('Compila tutti i campi!');
                return;
            }

            const total = players.reduce((s, p) => s + p.cred, 0);
            if (total + cred > 300) {
                log('❌ Crediti superati: ' + (total + cred) + '/300');
                alert('Max 300 crediti!');
                return;
            }

            players.push({id: Date.now(), name, role, team, cred});
            log(`✅ Giocatore aggiunto: ${name} (${team}, ${cred}cr)`);
            savePlayers();
        }

        // Remove player
        function removePlayer(id) {
            const p = players.find(x => x.id === id);
            players = players.filter(x => x.id !== id);
            log(`❌ Rimosso: ${p.name}`);
            savePlayers();
        }

        // Save players
        async function savePlayers() {
            if (appMode === 'test') {
                localStorage.setItem('players', JSON.stringify(players));
                log('💾 Salvato in localStorage');
            } else if (user && db) {
                try {
                    await db.collection('users').doc(user.uid).set({email: user.email, players});
                    log('💾 Salvato su Firestore');
                } catch (e) {
                    log('❌ Errore Firestore: ' + e.message);
                }
            }
            renderPlayers();
            document.getElementById('pName').value = '';
            document.getElementById('pRole').value = '';
            document.getElementById('pTeam').value = '';
            document.getElementById('pCred').value = '';
        }

        // Load players
        async function loadPlayers() {
            if (appMode === 'test') {
                players = JSON.parse(localStorage.getItem('players') || '[]');
                log('📂 Caricato da localStorage: ' + players.length + ' giocatori');
            } else if (user && db) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    players = doc.exists && doc.data().players ? doc.data().players : [];
                    log('📂 Caricato da Firestore: ' + players.length + ' giocatori');
                } catch (e) {
                    log('❌ Errore Firestore: ' + e.message);
                }
            }
            renderPlayers();
        }

        // Render players
        function renderPlayers() {
            const cred = players.reduce((s, p) => s + p.cred, 0);
            document.getElementById('crediti').textContent = cred;
            const rosa = document.getElementById('rosa');
            rosa.innerHTML = players.length === 0 ? '<p style="color: #999;">Nessun giocatore</p>' : players.map(p => 
                `<div class="player-card">
                    <div class="player-info">
                        <div class="player-name">${p.name}</div>
                        <div class="player-detail"><strong>${p.role}</strong> | ${p.team}</div>
                    </div>
                    <div style="text-align: right;">
                        <strong>${p.cred}cr</strong><br>
                        <button class="btn-remove" onclick="removePlayer(${p.id})">❌</button>
                    </div>
                </div>`
            ).join('');
        }

        // Logout
        function logoutUser() {
            if (appMode === 'live' && auth) {
                auth.signOut();
                log('👋 Logout (LIVE)');
            } else {
                user = null;
                players = [];
                localStorage.clear();
                log('👋 Logout (TEST)');
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('appScreen').classList.remove('show');
            }
        }

        log('🚀 App avviata - Modalità: TEST');
    </script>
</body>
</html>
