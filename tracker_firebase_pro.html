<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantacalcio PRO</title>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-box { background: white; border-radius: 15px; padding: 40px; width: 95%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .auth-box h2 { color: #667eea; margin-bottom: 25px; text-align: center; font-size: 28px; }
        
        .mode-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .mode-btn { padding: 14px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.3s; }
        .mode-btn.active { background: #667eea; color: white; }
        .mode-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; transition: border 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        
        .btn-submit { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn-submit:hover { background: #764ba2; }
        .btn-submit:active { transform: scale(0.98); }
        
        .message { padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: 500; display: none; }
        .message.show { display: block; animation: slideIn 0.3s ease; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .app-screen { display: none; flex-direction: column; height: 100vh; }
        .app-screen.active { display: flex; }
        .app-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .app-header h1 { font-size: 24px; }
        .user-section { text-align: right; }
        .logout-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        
        .tabs { display: flex; border-bottom: 2px solid #f0f0f0; overflow-x: auto; }
        .tab { padding: 15px 20px; cursor: pointer; background: #f9f9f9; border-bottom: 3px solid transparent; transition: all 0.3s; font-weight: 500; white-space: nowrap; }
        .tab.active { background: white; border-bottom-color: #667eea; color: #667eea; }
        .tab:hover { background: #f0f0f0; }
        
        .content { flex: 1; overflow-y: auto; padding: 30px 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .player-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .player-card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .player-info { flex: 1; }
        .player-name { font-weight: bold; color: #333; }
        .player-detail { font-size: 12px; color: #666; }
        .btn-remove { background: #ff6b6b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-remove:hover { opacity: 0.8; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-primary { background: #667eea; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.3s; }
        .btn-primary:hover { background: #764ba2; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; margin: 10px 0; }
        .stat-label { font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>
    <!-- AUTH SCREEN -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-box">
            <div class="mode-buttons">
                <button class="mode-btn active" id="btnLogin" onclick="changeMode('login')">🔐 Login</button>
                <button class="mode-btn" id="btnRegister" onclick="changeMode('register')">📝 Registrati</button>
            </div>
            
            <h2 id="authTitle">Login</h2>
            <div class="message" id="authMsg"></div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="tua@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Nome Utente</label>
                <input type="text" id="username" placeholder="Il tuo nome">
            </div>
            
            <button class="btn-submit" id="submitBtn" onclick="handleAuth()">🔐 Accedi</button>
        </div>
    </div>

    <!-- APP SCREEN -->
    <div class="app-screen" id="appScreen">
        <div class="app-header">
            <h1>⚽ Fantacalcio PRO</h1>
            <div class="user-section">
                <p id="userEmail" style="margin-bottom: 10px;"></p>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('rosa')">📋 Rosa</div>
            <div class="tab" onclick="switchTab('editor')">✏️ Editor</div>
            <div class="tab" onclick="switchTab('stats')">📊 Stats</div>
            <div class="tab" onclick="switchTab('menu')">⚙️ Menu</div>
        </div>
        
        <div class="content">
            <!-- ROSA TAB -->
            <div class="tab-content active" id="rosa">
                <h2>La Tua Rosa</h2>
                <p style="color: #666; margin-bottom: 20px;">Crediti: <strong id="creditiCount">0</strong> / 300</p>
                <div class="player-list" id="rosaList">
                    <p style="grid-column: 1/-1; color: #999;">Nessun giocatore. Vai su "Editor"!</p>
                </div>
            </div>
            
            <!-- EDITOR TAB -->
            <div class="tab-content" id="editor">
                <h2>Aggiungi Giocatore</h2>
                <div class="message" id="editorMsg"></div>
                
                <div class="form-group">
                    <label>Nome e Cognome</label>
                    <input type="text" id="playerName" placeholder="Es: Lautaro Martinez">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Ruolo</label>
                        <select id="playerRole" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                            <option value="">-- Seleziona --</option>
                            <option value="P">Portiere (P)</option>
                            <option value="D">Difensore (D)</option>
                            <option value="C">Centrocampista (C)</option>
                            <option value="A">Attaccante (A)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Squadra</label>
                        <select id="playerTeam" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
                            <option value="">-- Seleziona --</option>
                            <option value="Inter">Inter</option>
                            <option value="Juventus">Juventus</option>
                            <option value="Napoli">Napoli</option>
                            <option value="Milan">Milan</option>
                            <option value="Roma">Roma</option>
                            <option value="Lazio">Lazio</option>
                            <option value="Atalanta">Atalanta</option>
                            <option value="Fiorentina">Fiorentina</option>
                            <option value="Bologna">Bologna</option>
                            <option value="Como">Como</option>
                            <option value="Monza">Monza</option>
                            <option value="Genoa">Genoa</option>
                            <option value="Cagliari">Cagliari</option>
                            <option value="Torino">Torino</option>
                            <option value="Parma">Parma</option>
                            <option value="Venezia">Venezia</option>
                            <option value="Lecce">Lecce</option>
                            <option value="Frosinone">Frosinone</option>
                            <option value="Udinese">Udinese</option>
                            <option value="Sassuolo">Sassuolo</option>
                            <option value="Empoli">Empoli</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Crediti</label>
                    <input type="number" id="playerCrediti" placeholder="Es: 24" min="1" max="50">
                </div>
                
                <button class="btn-primary" onclick="addPlayer()">✅ Aggiungi</button>
            </div>
            
            <!-- STATS TAB -->
            <div class="tab-content" id="stats">
                <h2>Statistiche Rosa</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">Totali</div><div class="stat-value" id="statTot">0</div></div>
                    <div class="stat-card"><div class="stat-label">Portieri</div><div class="stat-value" id="statP">0</div></div>
                    <div class="stat-card"><div class="stat-label">Difensori</div><div class="stat-value" id="statD">0</div></div>
                    <div class="stat-card"><div class="stat-label">Centrocampisti</div><div class="stat-value" id="statC">0</div></div>
                    <div class="stat-card"><div class="stat-label">Attaccanti</div><div class="stat-value" id="statA">0</div></div>
                    <div class="stat-card"><div class="stat-label">Crediti</div><div class="stat-value" id="statCred">0/300</div></div>
                </div>
            </div>
            
            <!-- MENU TAB -->
            <div class="tab-content" id="menu">
                <h2>Menu</h2>
                <button class="btn-primary" onclick="resetRosa()" style="background: #ff6b6b; margin-bottom: 15px;">🗑️ Svuota Rosa</button>
                <p style="color: #666; font-size: 14px;">⚠️ Questa azione è irreversibile!</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC_jVxTyAiK8R2fC785C8nCQ0Gnr0nZjBtA",
            authDomain: "fantacalcio-pro-8e203.firebaseapp.com",
            projectId: "fantacalcio-pro-8e203",
            storageBucket: "fantacalcio-pro-8e203.firebasestorage.app",
            messagingSenderId: "258140309935",
            appId: "1:258140309935:web:f671d0c437c9a82a1b075a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let rosa = [];
        let authMode = 'login';

        function changeMode(mode) {
            alert('Bottone premuto: ' + mode);
            authMode = mode;
            const loginBtn = document.getElementById('btnLogin');
            const regBtn = document.getElementById('btnRegister');
            const nameGroup = document.getElementById('nameGroup');
            const title = document.getElementById('authTitle');
            const submitBtn = document.getElementById('submitBtn');

            if (mode === 'register') {
                loginBtn.classList.remove('active');
                regBtn.classList.add('active');
                nameGroup.style.display = 'block';
                title.textContent = 'Crea Account';
                submitBtn.textContent = '📝 Registrati';
            } else {
                loginBtn.classList.add('active');
                regBtn.classList.remove('active');
                nameGroup.style.display = 'none';
                title.textContent = 'Login';
                submitBtn.textContent = '🔐 Accedi';
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;
            const msg = document.getElementById('authMsg');

            if (!email || !password) {
                showMsg('Compila email e password!', 'error', msg);
                return;
            }

            try {
                if (authMode === 'login') {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    if (!username) {
                        showMsg('Compila il nome utente!', 'error', msg);
                        return;
                    }
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await userCred.user.updateProfile({ displayName: username });
                }
                showMsg('✅ Accesso riuscito!', 'success', msg);
            } catch (error) {
                showMsg('❌ Errore: ' + error.message, 'error', msg);
            }
        }

        function showMsg(text, type, element) {
            element.textContent = text;
            element.className = `message show ${type}`;
            setTimeout(() => element.classList.remove('show'), 3000);
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').classList.add('active');
                document.getElementById('userEmail').textContent = user.email;
                loadRosa();
            } else {
                currentUser = null;
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').classList.remove('active');
            }
        });

        async function addPlayer() {
            const name = document.getElementById('playerName').value;
            const role = document.getElementById('playerRole').value;
            const team = document.getElementById('playerTeam').value;
            const crediti = parseInt(document.getElementById('playerCrediti').value);
            const msg = document.getElementById('editorMsg');

            if (!name || !role || !team || !crediti) {
                showMsg('❌ Compila tutti i campi!', 'error', msg);
                return;
            }

            const totalCred = rosa.reduce((sum, p) => sum + p.crediti, 0);
            if (totalCred + crediti > 300) {
                showMsg(`❌ Max 300 crediti! Disponibili: ${300 - totalCred}`, 'error', msg);
                return;
            }

            rosa.push({
                id: Date.now().toString(),
                name,
                role,
                team,
                crediti
            });

            await saveRosa();
            showMsg('✅ Giocatore aggiunto!', 'success', msg);

            document.getElementById('playerName').value = '';
            document.getElementById('playerRole').value = '';
            document.getElementById('playerTeam').value = '';
            document.getElementById('playerCrediti').value = '';
        }

        async function removePlayer(id) {
            rosa = rosa.filter(p => p.id !== id);
            await saveRosa();
        }

        async function saveRosa() {
            if (!currentUser) return;
            try {
                await db.collection('users').doc(currentUser.uid).set({
                    email: currentUser.email,
                    rosa: rosa,
                    updated: new Date()
                });
                renderRosa();
            } catch (e) {
                console.error('Errore:', e);
            }
        }

        async function loadRosa() {
            if (!currentUser) return;
            try {
                const doc = await db.collection('users').doc(currentUser.uid).get();
                rosa = doc.exists && doc.data().rosa ? doc.data().rosa : [];
                renderRosa();
            } catch (e) {
                console.error('Errore:', e);
            }
        }

        function renderRosa() {
            const list = document.getElementById('rosaList');
            const cred = rosa.reduce((sum, p) => sum + p.crediti, 0);
            document.getElementById('creditiCount').textContent = cred;

            if (rosa.length === 0) {
                list.innerHTML = '<p style="grid-column: 1/-1; color: #999;">Nessun giocatore</p>';
                return;
            }

            list.innerHTML = rosa.map(p => `
                <div class="player-card">
                    <div class="player-info">
                        <div class="player-name">${p.name}</div>
                        <div class="player-detail"><strong>${p.role}</strong> | ${p.team} | ${p.crediti} cr</div>
                    </div>
                    <button class="btn-remove" onclick="removePlayer('${p.id}')">❌</button>
                </div>
            `).join('');

            updateStats();
        }

        function updateStats() {
            document.getElementById('statTot').textContent = rosa.length;
            document.getElementById('statP').textContent = rosa.filter(p => p.role === 'P').length;
            document.getElementById('statD').textContent = rosa.filter(p => p.role === 'D').length;
            document.getElementById('statC').textContent = rosa.filter(p => p.role === 'C').length;
            document.getElementById('statA').textContent = rosa.filter(p => p.role === 'A').length;
            document.getElementById('statCred').textContent = rosa.reduce((s, p) => s + p.crediti, 0) + '/300';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            if (tab === 'stats') updateStats();
        }

        async function resetRosa() {
            if (!confirm('Sei sicuro? Non puoi tornare indietro!')) return;
            rosa = [];
            await saveRosa();
        }

        async function logout() {
            await auth.signOut();
        }
    </script>
</body>
</html>
